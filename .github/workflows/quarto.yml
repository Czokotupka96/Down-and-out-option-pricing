
name: quarto

on: push

jobs:
  main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nbclient ipykernel matplotlib scipy open-atmos-jupyter-utils PyMPDATA

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Render notebook
        run: |
          python --version
          quarto --version
          quarto render Down_and_out_option.ipynb --to pdf --execute

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: down-and-out-option-pdf
          path: Down_and_out_option.pdf
          if-no-files-found: error
